<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dff6f3">
  <title>Dream Aquarium — 夢幻數位水族箱</title>
  <style>
    :root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#164b60;background:#edf9f6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#d9ecff 0,transparent 45%),linear-gradient(180deg,#f3fbf9,#dff4f5 90%)}
    .shell{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:32px 0 34px}.intro{text-align:center;margin:0 0 25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.33em;color:#4ca8ae;margin:0 0 8px}.intro h1{font-size:clamp(34px,5vw,58px);line-height:1.14;letter-spacing:-.06em;margin:0;color:#155d70;font-weight:850}.intro h1 span{color:#4fb8bd}.subtitle{font-size:14px;color:#6b9299;margin:11px 0 0}
    .panel{padding:17px;background:rgba(255,255,255,.73);border:1px solid rgba(255,255,255,.94);border-radius:27px;box-shadow:0 22px 70px rgba(45,110,127,.1),0 4px 12px rgba(60,128,138,.06)}
    .panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 7px 15px}.label-title{font-weight:800;font-size:17px;letter-spacing:.015em}.label-sub{font-size:12px;color:#80a0a9;margin-top:4px}.stats{display:flex;align-items:center;gap:9px}.chip{background:#e8f7f7;border:1px solid #d7eeef;border-radius:100px;padding:8px 13px;color:#356d7b;font-size:12px;font-weight:750;white-space:nowrap}.chip strong{font-size:14px;color:#0a8292}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#55c4b2;margin-right:7px;vertical-align:middle;box-shadow:0 0 0 4px #d2f1e9}
    .tank{position:relative;width:100%;height:clamp(330px,53vw,560px);border-radius:20px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#74d3db 0%,#269cae 43%,#0b587d 100%);cursor:crosshair;touch-action:pan-y}
    .tank canvas{display:block;width:100%;height:100%}.tank::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(224,255,255,.3),inset 0 0 90px rgba(5,50,83,.1)}
    .tank-head{position:absolute;z-index:2;top:19px;left:21px;color:#efffff;font-weight:700;font-size:11px;letter-spacing:.13em;text-shadow:0 1px 5px #2b7e88}.hint{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);padding:10px 17px;background:rgba(14,85,111,.29);border:1px solid rgba(255,255,255,.32);border-radius:40px;white-space:nowrap;color:#f5ffff;font-size:12px;backdrop-filter:blur(12px);pointer-events:none;transition:opacity .35s}.hint.off{opacity:0}
    .controls{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;padding:18px 5px 3px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:136px;min-height:47px;padding:10px 19px;border:1px solid #d3ecee;background:white;border-radius:15px;color:#316b7b;font:750 14px inherit;font-family:inherit;font-size:14px;font-weight:750;cursor:pointer;box-shadow:0 3px 9px rgba(45,121,131,.06);transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 17px rgba(38,118,133,.13);background:#f4fcfc}.btn:active{transform:translateY(0) scale(.97)}.btn:focus-visible{outline:3px solid #58b6c0;outline-offset:3px}.btn.primary{background:linear-gradient(120deg,#3bb5bd,#258ca9);color:white;border-color:transparent}.btn.primary:hover{background:linear-gradient(120deg,#42bdc2,#247f9a)}.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .notice{min-height:26px;text-align:center;margin:13px 0 0;color:#6f9ba6;font-size:13px}.footer{text-align:center;color:#93aeb4;font-size:11px;margin-top:17px;letter-spacing:.05em}.tank.night{background:#071c46}
    @media(max-width:620px){.shell{width:calc(100% - 18px);padding:21px 0}.panel{padding:9px;border-radius:21px}.panel-top{padding:9px 9px 14px;align-items:flex-start}.label-title{font-size:15px}.label-sub{font-size:11px}.stats{gap:5px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:6px 9px;font-size:11px}.chip strong{font-size:12px}.tank{height:clamp(390px,77vh,620px);border-radius:15px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:13px 3px 5px}.btn{min-width:0;padding:10px 6px}.hint{font-size:11px;padding:9px 12px}.intro{margin-bottom:18px}.intro h1{font-size:39px}}
    @media(prefers-reduced-motion:reduce){.btn,.hint{transition:none}}
  </style>
</head>
<body>
<main class="shell">
  <header class="intro"><p class="eyebrow">YOUR LITTLE UNDERWATER WORLD</p><h1>Dream <span>Aquarium</span></h1><p class="subtitle">留一點時間給自己，和海底的小夥伴慢慢相處。</p></header>
  <section class="panel" aria-label="互動數位水族箱">
    <div class="panel-top"><div><div class="label-title">✧ 我的水族箱</div><div class="label-sub">一個屬於你的療癒海底角落</div></div><div class="stats"><span class="chip">魚群 <strong id="fishCount">5</strong> 隻</span><span class="chip"><span class="status-dot"></span><span id="lightStatus">陽光海域</span></span></div></div>
    <div class="tank" id="tank"><canvas id="aquarium" aria-label="有游動魚群、漂浮氣泡和海底景色的互動水族箱"></canvas><div class="tank-head">✦ &nbsp; OCEAN LIFE</div><div class="hint" id="hint">移動滑鼠吸引魚群 · 點擊水面製造氣泡</div></div>
    <div class="controls">
      <button class="btn primary" id="feedBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>餵食魚群</button>
      <button class="btn" id="addBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c4-7 10-7 15 0-5 7-11 7-15 0ZM18 12l4-4v8l-4-4ZM7 11h.01"/></svg>增加魚兒</button>
      <button class="btn" id="removeBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c4-7 10-7 15 0-5 7-11 7-15 0ZM18 12l4-4v8l-4-4ZM7 11h.01M9 18h7"/></svg>移除魚兒</button>
      <button class="btn" id="lightBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.5 9 9 0 1 0 20.5 15.5Z"/></svg><span id="lightBtnText">切換夜間</span></button>
      <button class="btn" id="resetBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 6.4M3 4v7h7"/></svg>重新開始</button>
    </div>
    <p class="notice" id="notice" role="status" aria-live="polite">試著餵食看看，魚兒會游過來喔！</p>
  </section>
  <footer class="footer">MADE FOR SLOW MOMENTS &nbsp; · &nbsp; DREAM AQUARIUM</footer>
</main>
<script>
(()=>{'use strict';
const tank=document.getElementById('tank'),canvas=document.getElementById('aquarium'),ctx=canvas.getContext('2d');
const countEl=document.getElementById('fishCount'),statusEl=document.getElementById('lightStatus'),lightBtn=document.getElementById('lightBtn'),lightBtnText=document.getElementById('lightBtnText'),notice=document.getElementById('notice'),hint=document.getElementById('hint');
const TAU=Math.PI*2,palette=['#ffc37f','#fc9086','#ffde8c','#a8a0f0','#72d7de','#f4aacf','#8bdfbd'];
let W=800,H=480,dpr=1,fish=[],bubbles=[],particles=[],foods=[],plants=[],night=false,mouse={x:0,y:0,active:false,until:0},last=0,simTime=0,feedSession=0,feedDone=false,noticeTimer=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(hex,a)=>{const h=hex.replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
function say(s){notice.textContent=s;clearTimeout(noticeTimer)}
function makeFish(){const r=rand(14,25),speed=rand(19,39),dir=rand(0,TAU);return {x:rand(r+28,Math.max(r+29,W-r-28)),y:rand(75,Math.max(76,H-90)),vx:Math.cos(dir)*speed,vy:Math.sin(dir)*speed,dir,r,speed,agility:rand(.8,1.6),color:palette[Math.floor(rand(0,palette.length))],phase:rand(0,TAU),seed:rand(0,100),wander:rand(0,TAU),stripe:Math.random()>.52,shape:Math.random()>.6?1:.82}}
function seed(){fish=Array.from({length:5},makeFish);bubbles=[];foods=[];particles=Array.from({length:62},()=>({x:rand(0,W),y:rand(0,H),r:rand(.6,2.2),vy:rand(3,12),phase:rand(0,TAU)}));plants=Array.from({length:19},(_,i)=>({x:(i+.3)*W/19+rand(-12,12),h:rand(30,88),bend:rand(-14,14),phase:rand(0,TAU),green:i%3===0?'#53c0a5':i%3===1?'#3ba7a4':'#77d2ad'}));countEl.textContent=fish.length;mouse.active=false;feedDone=false;feedSession=0}
function resize(){const rect=tank.getBoundingClientRect();const oldW=W,oldH=H;W=Math.max(250,rect.width);H=Math.max(260,rect.height);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(fish.length){fish.forEach(f=>{f.x=clamp(f.x*W/oldW,f.r+8,W-f.r-8);f.y=clamp(f.y*H/oldH,f.r+12,H-f.r-22)});particles.forEach(p=>{p.x*=W/oldW;p.y*=H/oldH});plants.forEach(p=>{p.x*=W/oldW;p.h*=Math.min(1.25,H/oldH)})}}
function spawnBubbles(x,y,n=12){for(let i=0;i<n;i++){const life=rand(1.2,3.4);bubbles.push({x:x+rand(-25,25),y:y+rand(-12,17),r:rand(2.5,10),vy:rand(22,65),drift:rand(-13,13),age:0,life,phase:rand(0,TAU)})}if(bubbles.length>190)bubbles.splice(0,bubbles.length-190)}
function feed(){if(foods.length){say('魚兒正在享用點心！');return}feedSession++;feedDone=false;const cx=rand(W*.28,W*.72);for(let i=0;i<17;i++)foods.push({x:cx+rand(-54,54),y:rand(14,36),vy:rand(21,44),age:0,life:rand(10,14),r:rand(2.5,4.2)});spawnBubbles(cx,30,7);say('開飯囉！小魚們正在追著飼料游。');hint.classList.add('off')}
function feedComplete(){if(!feedDone&&feedSession>0){feedDone=true;say('餵食完成！魚兒們吃得好開心 ♡')}}
function update(dt){simTime+=dt;const now=performance.now();if(mouse.active&&mouse.until&&now>mouse.until)mouse.active=false;
  for(const p of particles){p.y-=p.vy*dt;p.x+=Math.sin(simTime*.6+p.phase)*dt*2;if(p.y<0){p.y=H;p.x=rand(0,W)} }
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.age+=dt;b.y-=b.vy*dt;b.x+=(b.drift+Math.sin(simTime*2+b.phase)*9)*dt;if(b.age>b.life||b.y<-15)bubbles.splice(i,1)}
  for(let i=foods.length-1;i>=0;i--){const p=foods[i];p.age+=dt;p.y=Math.min(H-30,p.y+p.vy*dt);p.x+=Math.sin(simTime*3+i)*dt*6;if(p.age>p.life)foods.splice(i,1)}
  for(const f of fish){let target=null,strength=0;let best=Infinity;
    for(const p of foods){const dx=p.x-f.x,dy=p.y-f.y,d=dx*dx+dy*dy;if(d<best){best=d;target=p}}if(target){strength=.95;if(best<(f.r*.8+5)**2){const idx=foods.indexOf(target);if(idx!==-1){foods.splice(idx,1);spawnBubbles(target.x,target.y,2)}target=null}}
    if(!target&&mouse.active){const dx=mouse.x-f.x,dy=mouse.y-f.y;if(Math.hypot(dx,dy)>f.r*2.8){target=mouse;strength=.48}}
    let ax=Math.cos(simTime*.42+f.wander)*.27,ay=Math.sin(simTime*.54+f.wander*1.3)*.32;
    if(target){const dx=target.x-f.x,dy=target.y-f.y,len=Math.hypot(dx,dy)||1;ax+=dx/len*strength;ay+=dy/len*strength}
    const margin=f.r*2+18,turn=1.6;if(f.x<margin)ax+=((margin-f.x)/margin)*turn;if(f.x>W-margin)ax-=((f.x-(W-margin))/margin)*turn;if(f.y<margin+10)ay+=((margin+10-f.y)/margin)*turn;if(f.y>H-margin-25)ay-=((f.y-(H-margin-25))/margin)*turn;
    const len=Math.hypot(ax,ay)||1,desiredX=ax/len*f.speed*(target?1.25:1),desiredY=ay/len*f.speed*(target?1.25:1),blend=Math.min(1,dt*f.agility*(target?1.4:.8));f.vx+=(desiredX-f.vx)*blend;f.vy+=(desiredY-f.vy)*blend;const v=Math.hypot(f.vx,f.vy),min=f.speed*.36;if(v<min){f.vx+=Math.cos(f.dir)*min*dt;f.vy+=Math.sin(f.dir)*min*dt}f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<f.r+5){f.x=f.r+5;f.vx=Math.abs(f.vx)}if(f.x>W-f.r-5){f.x=W-f.r-5;f.vx=-Math.abs(f.vx)}if(f.y<f.r+8){f.y=f.r+8;f.vy=Math.abs(f.vy)}if(f.y>H-f.r-25){f.y=H-f.r-25;f.vy=-Math.abs(f.vy)}f.dir=Math.atan2(f.vy,f.vx);
  }if(feedSession&&!foods.length)feedComplete()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill()}
function scenery(){const bg=ctx.createLinearGradient(0,0,0,H);if(night){bg.addColorStop(0,'#12265a');bg.addColorStop(.48,'#0b355d');bg.addColorStop(1,'#071f42')}else{bg.addColorStop(0,'#79d9d9');bg.addColorStop(.43,'#36abb8');bg.addColorStop(1,'#105d82')}ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=night?.07:.13;for(let i=0;i<6;i++){const x=W*(.05+i*.2)+Math.sin(simTime*.13+i)*22;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+W*.08,0);ctx.lineTo(x+W*.28,H);ctx.lineTo(x+W*.04,H);ctx.fill()}ctx.restore();
  const glow=ctx.createRadialGradient(W*.76,H*.16,4,W*.76,H*.16,W*.58);glow.addColorStop(0,night?'rgba(68,178,219,.09)':'rgba(234,255,231,.27)');glow.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  for(const p of particles){ctx.globalAlpha=night?.28:.27;ellipse(p.x,p.y,p.r,p.r,night?'#b5edfa':'#efffff')}ctx.globalAlpha=1;
  ctx.fillStyle=night?'#153d57':'#277e91';ctx.beginPath();ctx.moveTo(0,H-46);for(let x=0;x<=W+12;x+=12)ctx.lineTo(x,H-49+Math.sin(x*.016)*8+Math.sin(x*.041)*4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle=night?'#1e4a5b':'#d4c7a2';ctx.beginPath();ctx.moveTo(0,H-19);ctx.quadraticCurveTo(W*.25,H-38,W*.5,H-23);ctx.quadraticCurveTo(W*.75,H-8,W,H-29);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  for(const p of plants){const swing=Math.sin(simTime*.8+p.phase)*9;ctx.strokeStyle=night?'#388a93':p.green;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,H-18);ctx.quadraticCurveTo(p.x+p.bend,H-p.h*.55,p.x+swing+p.bend,H-p.h);ctx.stroke();for(let k=1;k<=3;k++){const h=p.h*k/4,side=k%2?1:-1;ctx.strokeStyle=night?'#307682':p.green;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+p.bend*(h/p.h)*.7,H-18-h);ctx.quadraticCurveTo(p.x+side*13,H-22-h-10,p.x+side*18+swing*.5,H-20-h-19);ctx.stroke()}}
  for(let i=0;i<12;i++){const x=W*(i+.45)/12+Math.sin(i*33)*18,y=H-10+Math.sin(i)*6;ellipse(x,y,randRock(i),randRock(i)*.7,night?'#274b5c':'#779fa1')}
  coral(W*.12,H-19,.9,'#f4a68c');coral(W*.84,H-22,1.3,'#d7a3db');
}
function randRock(i){return 7+(Math.sin(i*7+1)+1)*7}
function coral(x,y,s,c){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=night?'#a07cb6':c;ctx.lineWidth=7;ctx.lineCap='round';for(const [x1,y1,x2,y2] of [[0,0,0,-35],[0,-19,-14,-36],[0,-30,13,-52],[-14,-36,-17,-48],[13,-52,19,-61],[0,-10,15,-25]]){ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(x1+(x2-x1)*.4,y2+7,x2,y2);ctx.stroke()}ctx.restore()}
function drawFish(f){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.vx<0?-1:1,1);ctx.rotate(clamp(Math.atan2(f.vy,Math.max(Math.abs(f.vx),.001)),-.22,.22));const r=f.r,t=Math.sin(simTime*9+f.phase);ctx.globalAlpha=.17;ellipse(-1,r*.84,r*1.1,r*.24,'#07364f');ctx.globalAlpha=1;
  ctx.fillStyle=rgba(f.color,.75);ctx.beginPath();ctx.moveTo(-r*.6,0);ctx.lineTo(-r*1.58,-r*.62*(1+t*.18));ctx.lineTo(-r*1.51,r*.62*(1-t*.18));ctx.closePath();ctx.fill();
  ctx.fillStyle=rgba(f.color,.87);ctx.beginPath();ctx.moveTo(-r*.34,-r*.34);ctx.lineTo(-r*.2,-r*.95);ctx.lineTo(r*.37,-r*.4);ctx.fill();
  ellipse(0,0,r*f.shape,r*.64,f.color);ellipse(r*.05,r*.2,r*.68,r*.27,'rgba(255,255,255,.18)');
  if(f.stripe){ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=r*.1;for(let j=-1;j<=1;j++){const x=j*r*.28;ctx.beginPath();ctx.moveTo(x,-r*.45);ctx.quadraticCurveTo(x-r*.1,0,x,r*.45);ctx.stroke()}}
  ellipse(r*.53,-r*.13,r*.13,r*.13,'#fff');ellipse(r*.57,-r*.13,r*.065,r*.07,'#153d59');ctx.strokeStyle=rgba(f.color,.85);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r*.16,r*.34);ctx.lineTo(-r*.28,r*.7+t*2);ctx.stroke();
  if(night){ctx.shadowColor=f.color;ctx.shadowBlur=17;ctx.strokeStyle=rgba(f.color,.35);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,r*f.shape,r*.64,0,0,TAU);ctx.stroke()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);scenery();for(const p of foods){ctx.globalAlpha=Math.min(1,(p.life-p.age)*1.5);ellipse(p.x,p.y,p.r,p.r*.8,'#f7d589')}ctx.globalAlpha=1;for(const f of fish)drawFish(f);
for(const b of bubbles){ctx.globalAlpha=clamp((b.life-b.age)/.65,0,.63);ctx.strokeStyle=night?'#9de6fa':'#e6fffd';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();ellipse(b.x-b.r*.29,b.y-b.r*.37,Math.max(1,b.r*.15),Math.max(1,b.r*.15),'#ffffff')}ctx.globalAlpha=1;
if(night){const v=ctx.createRadialGradient(W*.5,H*.4,H*.08,W*.5,H*.4,W*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,6,24,.23)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}}
function frame(ts){if(!last)last=ts;const dt=Math.min((ts-last)/1000,.04);last=ts;update(dt);draw();requestAnimationFrame(frame)}
function pos(e){const r=canvas.getBoundingClientRect();return {x:clamp(e.clientX-r.left,0,W),y:clamp(e.clientY-r.top,0,H)}}
tank.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.pointerType==='pen'){const p=pos(e);mouse={...p,active:true,until:0};hint.classList.add('off')}});tank.addEventListener('pointerleave',()=>{mouse.active=false});tank.addEventListener('pointerdown',e=>{const p=pos(e);spawnBubbles(p.x,p.y,14);mouse={...p,active:true,until:performance.now()+2300};hint.classList.add('off')});
document.getElementById('feedBtn').addEventListener('click',feed);
document.getElementById('addBtn').addEventListener('click',()=>{if(fish.length>=40){say('水族箱最多容納 40 隻魚，讓大家有足夠空間游泳吧！');return}fish.push(makeFish());countEl.textContent=fish.length;say('歡迎新朋友！現在有 '+fish.length+' 隻小魚 ♡')});
document.getElementById('removeBtn').addEventListener('click',()=>{if(!fish.length){say('水族箱已經沒有魚兒可以移除了。');return}fish.pop();countEl.textContent=fish.length;say(fish.length?'已移除一隻魚兒，目前有 '+fish.length+' 隻。':'魚兒都離開了，按「增加魚兒」迎接新朋友吧！')});
lightBtn.addEventListener('click',()=>{night=!night;tank.classList.toggle('night',night);statusEl.textContent=night?'夢幻夜海':'陽光海域';lightBtnText.textContent=night?'切換白天':'切換夜間';lightBtn.setAttribute('aria-pressed',String(night));say(night?'夜晚的海底，閃著安靜的光。':'陽光回到水面，魚兒繼續散步。')});
document.getElementById('resetBtn').addEventListener('click',()=>{night=false;tank.classList.remove('night');statusEl.textContent='陽光海域';lightBtnText.textContent='切換夜間';lightBtn.setAttribute('aria-pressed','false');seed();say('水族箱已恢復初始狀態，一起重新開始吧！')});
resize();seed();if('ResizeObserver'in window)new ResizeObserver(resize).observe(tank);else window.addEventListener('resize',resize);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
